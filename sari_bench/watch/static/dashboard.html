<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sari Bench — live</title>
<style>
  :root {
    --bg: #14161a; --panel: #1c1f25; --line: #2c313a; --ink: #e6e8ec; --dim: #9aa3b0;
    --ok: #4fa96b; --watch: #e0a23f; --alert: #e0553f; --idle: #5a6472; --accent: #4f8fd0;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 16px; align-items: baseline;
           padding: 12px 18px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: .2px; }
  .muted { color: var(--dim); font-size: 12.5px; }
  .pill { padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); font-size: 12px; color: var(--dim); }
  main { padding: 16px; display: grid; gap: 14px;
         grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
          display: flex; flex-direction: column; border-left: 4px solid var(--idle); }
  .card.ok { border-left-color: var(--ok); }
  .card.watch { border-left-color: var(--watch); }
  .card.alert { border-left-color: var(--alert); box-shadow: 0 0 0 1px rgba(224,85,63,.35); }
  .card.finished { opacity: .68; }
  .card-head { padding: 10px 12px; display: flex; gap: 8px; align-items: baseline; justify-content: space-between; }
  .title { font-weight: 620; font-size: 13.5px; }
  .prompt { padding: 0 12px 8px; color: var(--dim); font-size: 12.5px;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .frame { width: 100%; aspect-ratio: 16/9; object-fit: cover; background: #0d0f12; display: block; }
  .frame.none { display: grid; place-items: center; color: var(--dim); font-size: 12px; }
  .rows { padding: 8px 12px; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 12.5px; }
  .rows dt { color: var(--dim); }
  .rows dd { margin: 0; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sig { margin: 0 12px 8px; padding: 6px 8px; border-radius: 6px; font-size: 12px;
         background: rgba(224,85,63,.12); color: #f0a596; }
  .sig.watch { background: rgba(224,162,63,.12); color: #e8c48d; }
  .actions { margin-top: auto; padding: 8px 12px 12px; display: flex; gap: 8px; }
  button { font: inherit; font-size: 12.5px; padding: 5px 10px; border-radius: 6px; cursor: pointer;
           background: #262b33; color: var(--ink); border: 1px solid var(--line); }
  button:hover { background: #2f3540; }
  button.danger { color: #ffbdb1; border-color: #57302a; }
  button.danger:hover { background: #3a221e; }
  pre.log { margin: 0 12px 12px; padding: 8px; background: #0d0f12; border: 1px solid var(--line);
            border-radius: 6px; font-size: 11.5px; max-height: 190px; overflow: auto; white-space: pre-wrap; }
  .empty { padding: 48px 18px; color: var(--dim); text-align: center; grid-column: 1 / -1; }
  .badge { font-size: 11.5px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); }
  .badge.alert { color: #f0a596; border-color: #57302a; }
  .badge.watch { color: #e8c48d; border-color: #58472a; }
  .badge.success { color: #a8dcbb; border-color: #2c4b38; }
  .badge.fail { color: #f0a596; border-color: #57302a; }
</style>
</head>
<body>
<header>
  <h1>Sari Bench</h1>
  <span class="pill" id="battery">—</span>
  <span class="pill" id="mode">—</span>
  <span class="muted" id="progress"></span>
  <span class="muted" id="pool"></span>
  <span class="muted" id="updated" style="margin-left:auto"></span>
</header>
<main id="grid"><div class="empty">Loading…</div></main>

<script>
const openLogs = new Set();
let frameTick = 0;

const fmtMin = s => (s === null || s === undefined) ? "—"
  : (s < 0 ? "-" : "") + Math.floor(Math.abs(s) / 60) + "m" + String(Math.floor(Math.abs(s) % 60)).padStart(2, "0") + "s";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function classOf(a) {
  if (a.state === "finished" || a.state === "requeued") return "finished";
  if (a.state === "orphaned") return "alert";
  return (a.health && a.health.level) || "ok";
}

function statusBadge(a) {
  if (a.state === "finished") {
    const cls = a.success ? "success" : "fail";
    return `<span class="badge ${cls}">${esc(a.outcome || "finished")}</span>`;
  }
  if (a.state === "orphaned") return `<span class="badge alert">orphaned</span>`;
  if (a.state === "requeued") return `<span class="badge">requeued</span>`;
  const lvl = (a.health && a.health.level) || "ok";
  return `<span class="badge ${lvl}">${lvl === "ok" ? "running" : lvl}</span>`;
}

function card(a) {
  const live = a.state === "starting" || a.state === "running";
  const lvl = (a.health && a.health.level) || "ok";
  const showSig = live && lvl !== "ok" && a.health.summary;
  const logOpen = openLogs.has(a.key);
  const frame = a.frame
    ? `<img class="frame" alt="latest frame" src="/api/attempt/${encodeURI(a.key)}/frame.png?t=${frameTick}">`
    : `<div class="frame none">no frame yet</div>`;

  return `<section class="card ${classOf(a)}" data-key="${esc(a.key)}">
    <div class="card-head">
      <span class="title">${esc(a.prompt_id)} · try ${a.attempt}</span>
      ${statusBadge(a)}
    </div>
    <div class="prompt">${esc(a.prompt)}</div>
    ${frame}
    ${showSig ? `<div class="sig ${lvl}">${esc(a.health.summary)}</div>` : ""}
    <dl class="rows">
      <dt>leg</dt><dd>${a.leg ?? "—"} ${esc(a.leg_type || "")}</dd>
      <dt>step</dt><dd>${a.step || 0}${a.max_steps ? " / " + a.max_steps : ""} ${a.mode ? "· " + esc(a.mode) : ""}</dd>
      <dt>action</dt><dd>${esc(JSON.stringify(a.actions ?? "—"))}</dd>
      <dt>at</dt><dd>${esc(a.near_cp ?? "—")}${a.blocked ? " · BLOCKED" : ""}</dd>
      <dt>held</dt><dd>${esc(a.gripped_name ?? a.gripped ?? "—")}</dd>
      <dt>elapsed</dt><dd>${fmtMin(a.elapsed_seconds)}${live && a.remaining_seconds !== null ? " · " + fmtMin(a.remaining_seconds) + " left" : ""}</dd>
      <dt>sandbox</dt><dd>${esc(a.sandbox_id || "—")}</dd>
      ${a.end_reason ? `<dt>end</dt><dd>${esc(a.end_reason)}</dd>` : ""}
    </dl>
    <div class="actions">
      <button data-act="log" data-key="${esc(a.key)}">${logOpen ? "hide log" : "log"}</button>
      ${live ? `<button class="danger" data-act="kill" data-key="${esc(a.key)}">kill</button>` : ""}
    </div>
    ${logOpen ? `<pre class="log" id="log-${esc(a.key)}">loading…</pre>` : ""}
  </section>`;
}

async function refresh() {
  let state;
  try {
    state = await (await fetch("/api/state")).json();
  } catch (e) {
    document.getElementById("updated").textContent = "disconnected";
    return;
  }
  frameTick++;

  document.getElementById("battery").textContent = state.battery_id || "no battery";
  document.getElementById("mode").textContent = state.mode === "pinned" ? "pinned" : "auto-discover";
  const b = state.battery || {}, atts = state.attempts || [];
  const done = atts.filter(a => a.state === "finished").length;
  const live = atts.filter(a => a.state === "starting" || a.state === "running").length;
  document.getElementById("progress").textContent =
    b.planned_attempts ? `${done}/${b.planned_attempts} done · ${live} live` : `${atts.length} attempt(s)`;
  document.getElementById("pool").textContent = state.pool_error
    ? "pool: coordinator unreachable"
    : `pool: ${(state.pool || []).length} sandbox(es)`;
  document.getElementById("updated").textContent = "updated " + new Date().toLocaleTimeString();

  const grid = document.getElementById("grid");
  grid.innerHTML = atts.length
    ? atts.map(card).join("")
    : `<div class="empty">${esc(state.error || "No attempts yet — waiting for the runner.")}</div>`;

  openLogs.forEach(loadLog);
}

async function loadLog(key) {
  const el = document.getElementById("log-" + key);
  if (!el) return;
  try {
    const data = await (await fetch(`/api/attempt/${encodeURI(key)}/log`)).json();
    el.textContent = (data.lines || []).join("\n") || "(empty)";
    el.scrollTop = el.scrollHeight;
  } catch { el.textContent = "(unreadable)"; }
}

document.addEventListener("click", async ev => {
  const button = ev.target.closest("button[data-act]");
  if (!button) return;
  const key = button.dataset.key;

  if (button.dataset.act === "log") {
    openLogs.has(key) ? openLogs.delete(key) : openLogs.add(key);
    refresh();
    return;
  }

  if (button.dataset.act === "kill") {
    if (!confirm(`Kill ${key}?\n\nThe agent is terminated; the runner records the attempt and the coordinator resets and re-pools its sandbox.`)) return;
    button.disabled = true;
    const res = await (await fetch(`/api/attempt/${encodeURI(key)}/kill`, { method: "POST" })).json();
    if (!res.ok) alert("Kill failed: " + (res.error || "unknown"));
    refresh();
  }
});

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
