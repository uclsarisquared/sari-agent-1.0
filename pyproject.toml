[project]
name = "sari-agent"
version = "1.0.0"
description = "Virtual embodied agent operating in a 3D convenience store environment"
readme = "README.md"
# Pinned by .python-version (3.10.13). numpy<2 and the measured runtime were both established
# on 3.10; do not widen without re-measuring.
requires-python = ">=3.10,<3.11"

# Derived from actual imports, NOT from overhaul/requirements.txt — that file is a whole-
# environment `pip freeze` (100+ entries incl. torch==2.2.1+cu121, transformers, opencv,
# scipy, scikit-image). None of those are imported anywhere in this repo, and the +cu121
# torch pin cannot resolve off Windows/CUDA at all.
dependencies = [
    # --- Agent runtime -----------------------------------------------------------
    "openai>=1.79.0",          # UCL vLLM server client (OpenAI-compatible)
    "python-dotenv>=1.1.0",    # config.env. NB: not the `dotenv` package — see [tool.uv] note
    "loguru>=0.7.3",
    # --- Unity sim bridge --------------------------------------------------------
    "websockets>=15.0",
    "requests>=2.32.3",
    # --- Perception / mapping ----------------------------------------------------
    # CONFLICT, resolved deliberately: both requirements.txt files pin pillow==11.2.1, but
    # moondream (every version, incl. latest 1.3.0) requires pillow<11.0.0 — and moondream is
    # NOT in either requirements file, so that env had an unresolved conflict pip never
    # surfaced. moondream is measured-working and deliberately retained (see md_tools.py), so
    # pillow yields. The repo only uses stable Image open/save/crop/draw APIs.
    "pillow>=10.4.0,<11",
    "numpy>=1.26.4,<2",        # 1.26.4 is the measured pin; 2.x is untested here
    "matplotlib>=3.10.3",      # slamtest grid/topology renders
    # Grab-time pointing; top-level import in md_tools.py. >=1.2 is load-bearing: moondream
    # 0.1.x caps pillow<11, which conflicts with the pillow 11.2.1 the rest of the repo was
    # measured on. It was unpinned in both requirements.txt files, so no pin is being broken.
    "moondream>=1.2",
    # Region OCR of the POS screen (central ocr-server / perception.read_text_in_box). NOT optional:
    # 2026-07-28 (user directive): read_text_in_box now RAISES when OCR can't run rather than
    # returning [], because an empty read is indistinguishable from "nothing scanned" to the
    # checkout callers. A dependency you must have for the checkout path to work at all does not
    # belong behind an extra. Paddle wheels are large (~1GB with paddlex) and were kept opt-in for
    # Apple Silicon; if they will not resolve there, drop these two lines locally rather than
    # re-adding the extra, and expect the checkout path to fail loudly.
    # Only the central daemon imports these; they remain base dependencies for now. Measured working:
    # paddleocr 3.7.0 + paddlepaddle 3.3.1 on linux/x86_64. The >=3 floor is load-bearing.
    "paddleocr>=3.0.0",
    "paddlepaddle>=3.0.0",
    # --- Legacy root stack -------------------------------------------------------
    "litserve>=0.2.9",         # server.py
    "google-genai>=1.14.0",    # functions.py, comprehension.py
    "pynput>=1.7",             # keyboard_control.py, slamtest/manual_map.py
]

# NB: there is deliberately no `ocr` extra any more (removed 2026-07-28). paddleocr/paddlepaddle
# moved into the base dependencies above — `uv sync` alone now installs them, no `--extra ocr`.

[tool.uv]
# Not an installable package — a collection of scripts run in place. Without this, uv would
# try to build and install the project itself and fail (no package layout).
package = false

# The `dotenv` distribution on PyPI is NOT what `from dotenv import load_dotenv` resolves to;
# that comes from `python-dotenv`. Both are listed in the old requirements.txt files, which is
# how the confusion started. Never add `dotenv` here.

[dependency-groups]
dev = [
    "poethepoet>=0.37.0",
    "pytest>=8.3",
]

[tool.poe.tasks]
ocr-server = { cmd = "python -m sari_bench ocr-server", help = "Run the shared runner-local PaddleOCR service on 127.0.0.1:9100" }
dbench-watch = { cmd = "python -m sari_bench watch --host 0.0.0.0", help = "Live dashboard for a running battery (run beside the runner)" }
dbench-coordinator = { cmd = "python -m sari_bench coordinator --port 9000", help = "Run the sandbox registry" }
dbench-status = { cmd = "python -m sari_bench status --coordinator ws://127.0.0.1:9000", help = "Print the current sandbox pool" }
dbench-run = { cmd = """
    python -m sari_bench run
        --prompts sari_bench/prompts/${difficulty}_prompts.json
        --tries 5
        --time-limit 120
        --per-leg-minutes 40
	--completion-guard vlm
        --coordinator ws://127.0.0.1:9000
        --sandbox-startup-timeout 30
        --arm graph
        --map-dir overhaul/slamtest/output_runs/run_0724_164652
""", help = "Run a prompt-difficulty battery across the fleet (needs a coordinator running)", args = [
    { name = "difficulty", positional = true, default = "easy", choices = [
        "easy",
        "medium",
        "hard",
    ], help = "Prompt difficulty battery to run" },
] }
debug-run = { cmd = """
    python orchestrator/subtask_agents.py
    --task "${prompt}"
    --arm graph
    --completion-guard vlm
    --max-steps 30
    --output-dir slamtest/output_runs/run_0724_164652
""", cwd = "overhaul", help = "Repro a single subtask standalone (default prompt: Get this item)", args = [
    { name = "prompt", positional = true, default = "Get this item", help = "Task prompt to run, e.g. 'Pick up Ritz Crackers'" },
] }
